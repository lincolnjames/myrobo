spring:
  application:
    name: myrobo
  datasource:
    # Supabase → Connect → Session pooler 연결 문자열 (IPv4 지원). JDBC 형식으로:
    # jdbc:postgresql://<pooler-host>:5432/postgres?sslmode=require
    url: ${DB_URL}
    username: ${DB_USER}          # Session pooler는 postgres.<project-ref> 형식
    password: ${DB_PASSWORD}
    hikari:
      schema: robo                # 모든 쿼리가 robo 스키마를 기본으로 사용
      maximum-pool-size: 3        # 1인용 배치라 작게. 무료 플랜 연결 수 절약
  flyway:
    schemas: robo
    default-schema: robo

robo:
  config-path: ${ROBO_CONFIG_PATH:config/robo-config.yml}
  config:
    require-approval: true        # 승인 안 된 설정 파일이면 시작 거부
  daily:
    auto-plan: true               # 수집이 오류 없이 끝나면 주문안까지 만든다. false면 수집만 (주문은 늘 사람이 한다)
    catch-up: true                # 앱을 켰을 때 오늘 몫이 없으면(08:00을 놓침) 한 번 따라잡는다
    catch-up-after: "08:10"       # 이 시각(KST) 이후에만. 정규 실행(08:00)과 겹치지 않게
    catch-up-delay-seconds: 60    # 기동 후 이만큼 기다렸다가 확인
  notify:
    telegram:
      token: ${TELEGRAM_BOT_TOKEN:}     # 둘 다 있어야 알림이 켜진다. 비밀값이라 환경변수로만
      chat-id: ${TELEGRAM_CHAT_ID:}
    healthcheck-url: ${HEALTHCHECK_URL:}   # healthchecks.io 핑 URL. 비밀 키가 들어 있어 환경변수로만. 없으면 꺼짐
    healthcheck-backup-url: ${HEALTHCHECK_BACKUP_URL:}   # 주간 백업용 별도 체크 (주기 7일, 유예 1일 권장). 없으면 꺼짐
  backup:
    enabled: true
    cron: "0 0 9 * * SUN"         # 매주 일요일 09:00 KST. 일요일 08:00 매일 작업이 끝난 뒤
    dir: ${BACKUP_DIR:${user.home}/myrobo-backups}   # 클라우드 동기화 폴더로 바꾸면 PC 고장에도 안전 (잔고·체결 내역이 들어 있음)
    keep: 8                       # 최근 몇 개를 남길지
  collector:
    enabled: true
    cron: "0 0 8 * * *"           # 매일 08:00 KST. 겨울에도 미국 일봉 반영(17:45 ET) 이후
    backfill-start: 2000-01-01    # 처음 받을 때 이 날짜부터 (상장 전이면 상장일부터 옴)
    tiingo:
      base-url: https://api.tiingo.com
      key: ${TIINGO_KEY:}
      per-hour: 45                # 무료 한도 시간당 50회보다 여유 있게
      per-day: 900                # 무료 한도 하루 1,000회보다 여유 있게
    finnhub:
      base-url: https://finnhub.io/api/v1
      key: ${FINNHUB_KEY:}
    koreaexim:
      base-url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
      key: ${KOREAEXIM_KEY:}      # 없으면 Frankfurter로 대신함
    frankfurter:
      base-url: https://api.frankfurter.dev
      key: ""

server:
  port: 8080
  address: 127.0.0.1              # 입력 화면은 외부에 공개하지 않는다 (원격 접속은 VPN으로)
