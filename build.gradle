plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.myrobo'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot BOM으로 모든 버전을 맞춘다 (별도 dependency-management 플러그인 없이)
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'   // Boot 4: flyway-core만으로는 자동 설정 안 됨
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.yaml:snakeyaml'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// JDK 17 이상 어떤 버전으로 빌드해도 Java 17 기준으로 컴파일한다
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing']
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
